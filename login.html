<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kemuning Forest Living Atlas</title>
    <style>
        :root {
            --bg: #1c2d15; --accent: #c4ff9d; --muted: #6b7a63; --panel: #23321f;
        }
        body {
            font-family: 'Raleway', system-ui, Arial, sans-serif;
            background: linear-gradient(rgba(28, 45, 21, 0.97), rgba(28, 45, 21, 0.99)), url('assets/bg.jpg') center/cover no-repeat fixed;
            color: var(--accent); margin: 0;
            padding-top: 80px; display: flex; align-items: center; justify-content: center;
            min-height: calc(100vh - 80px);
        }
        @font-face {
            font-family: 'WWF';
            src: url('assets/wwf.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Raleway';
            src: url('assets/Raleway-Medium.ttf') format('truetype');
        }
        nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 40px;background:rgba(12,18,10,0.98);z-index:1200}
        .nav-logo img { height: 40px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a{color:var(--accent);text-decoration:none;font-family:'WWF', sans-serif; font-size: 20px; letter-spacing: 1px; padding:6px 14px;border-radius:20px;transition:all .22s}
        .nav-links a.active, .nav-links a:hover{background:#314d25;color:#fff}
        
        .login-container {
            background: var(--panel);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-container h1 {
            font-family: 'WWF', sans-serif;
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 14px; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4a5a47;
            background: #2b3b2a;
            color: var(--accent);
            font-family: 'Raleway', sans-serif;
            font-size: 16px;
            box-sizing: border-box;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: var(--bg);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .login-btn:hover { opacity: 0.9; }
        #error-message { color: #ff8a8a; margin-top: 15px; height: 20px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">
            <img src="assets/jawi.png" alt="Javan Wildlife Institute Logo">
        </a>
        <div class="nav-links">
            <a href="index.html#home">HOME</a>
            <a href="index.html#location">LOCATION</a>
            <a href="explore.html" class="active">EXPLORE</a>
            <a href="species.html">SPECIES</a>
            <a href="about.html">ABOUT</a>
            <a href="#" id="logout-btn" style="display: none;">LOGOUT</a>
        </div>
    </nav>

    <div class="login-container">
        <h1>Access Data</h1>
        <form id="login-form">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <p id="error-message"></p>
        </form>
    </div>

    <script>
        // This script handles login and also ensures the logout button is not shown on the login page itself.
        document.addEventListener('DOMContentLoaded', () => {
            // If a user is somehow logged in and lands here, log them out.
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                sessionStorage.removeItem('isLoggedIn');
            }
        });

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            if (username === 'admin' && password === 'admin') {
                sessionStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'explore.html';
            } else {
                errorMessage.textContent = 'Invalid username or password.';
            }
        });
    </script>
</body>
</html>
