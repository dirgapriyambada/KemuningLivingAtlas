<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Species - Kemuning Forest Living Atlas</title>
    <style>
        :root {
            --bg: #1c2d15; --accent: #c4ff9d; --muted: #6b7a63; --panel: #23321f;
        }
        body {
            font-family: Inter, system-ui, Arial, sans-serif;
            font-family: 'Raleway', system-ui, Arial, sans-serif;
            background: linear-gradient(rgba(28, 45, 21, 0.97), rgba(28, 45, 21, 0.99)), url('assets/bg.jpg') center/cover no-repeat fixed;
            color: var(--accent); margin: 0;
            padding-top: 80px;
        }
        @font-face {
            font-family: 'WWF';
            src: url('assets/wwf.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Raleway';
            src: url('assets/Raleway-Medium.ttf') format('truetype');
        }
        nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 40px;background:rgba(12,18,10,0.98);z-index:1200}
        .nav-logo img { height: 40px; transition: transform 0.2s; }
        .nav-logo:hover img { transform: scale(1.1); }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a{color:var(--accent);text-decoration:none;font-family:'WWF', sans-serif; font-size: 20px; letter-spacing: 1px; padding:6px 14px;border-radius:20px;transition:all .22s}
        .nav-links a.active, .nav-links a:hover{background:#314d25;color:#fff}

        .container {
            max-width: 960px; margin: 40px auto; padding: 20px;
        }

        /* View for choosing taxa */
        #taxa-selection-view {
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; text-align: center;
        }
        .taxa-card {
            background: var(--panel); padding: 30px 50px; border-radius: 15px;
            cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
        }
        .taxa-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        .taxa-card img {
            width: 128px; height: 128px; margin-bottom: 15px;
        }
        .taxa-card h2 {
            font-family: 'WWF', sans-serif;
            font-size: 32px; margin-bottom: 5px; letter-spacing: 1px;
        }
        .taxa-card .species-count {
            font-size: 36px; font-weight: bold; color: var(--accent);
        }
        .taxa-cards-container { display: flex; gap: 60px; }
        #neighbors-title {
            font-family: 'WWF', sans-serif;
            font-size: 48px;
            opacity: 0;
            animation: fadeIn 1.5s ease 0.5s forwards;
        }

        /* View for species table */
        #species-table-view {
            display: none; /* Hidden by default */
        }
        #species-table-view h1 {
            color: var(--accent); border-bottom: 2px solid var(--accent);
            padding-bottom: 10px; margin-bottom: 20px;
        }
        .back-btn {
            display: inline-block; margin-bottom: 20px; padding: 8px 16px;
            background: var(--muted); color: var(--bg); text-decoration: none;
            border-radius: 8px; font-weight: bold; transition: background 0.2s;
        }
        .back-btn:hover { background: var(--accent); }

        table {
            width: 100%; border-collapse: collapse; font-size: 14px;
            background: var(--panel); border-radius: 8px; overflow: hidden;
        }
        th, td {
            padding: 12px 15px; text-align: left; border-bottom: 1px solid #2f452a;
        }
        thead tr { background: #2a3f25; }
        th { font-weight: bold; color: var(--accent); }
        td { color: #dfeee0; }
        tbody tr:nth-child(even) { background: rgba(0,0,0,0.1); }
        td em { font-family: 'Times New Roman', Times, serif; }

        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

    <nav>
        <a href="about.html" class="nav-logo">
            <img src="assets/jawi.png" alt="Javan Wildlife Institute Logo">
        </a>
        <div class="nav-links">
            <a href="index.html#home">HOME</a>
            <a href="index.html#location">LOCATION</a>
            <a href="explore.html">EXPLORE</a>
            <a href="species.html" class="active">SPECIES</a>
            <a href="about.html">ABOUT</a>
            <span id="auth-link-container"></span>
        </div>
    </nav>

    <div class="container">
        <div id="taxa-selection-view">
            <div class="taxa-cards-container">
                <div class="taxa-card" data-taxa="Mamalia">
                    <img src="assets/icon_mammals.png" alt="Mammals Icon">
                    <h2>MAMMALS</h2>
                    <div class="species-count" id="mammal-count">0 SPECIES</div>
                </div>
                <div class="taxa-card" data-taxa="Burung">
                    <img src="assets/icon_birds.png" alt="Birds Icon">
                    <h2>BIRDS</h2>
                    <div class="species-count" id="bird-count">0 SPECIES</div>
                </div>
            </div>
            <h2 id="neighbors-title">Our Wild Neighbors!</h2>
        </div>

        <div id="species-table-view">
            <a href="#" class="back-btn" id="back-to-selection">&larr; Back</a>
            <h1 id="table-title">Species List</h1>
            <table id="species-table">
                <thead>
                    <tr>
                        <th>Common Name</th>
                        <th>Scientific Name</th>
                        <th>IUCN Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows will be inserted here by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        // --- DOM Elements ---
        const taxaSelectionView = document.getElementById('taxa-selection-view');
        const speciesTableView = document.getElementById('species-table-view');
        const backBtn = document.getElementById('back-to-selection');
        const tableTitle = document.getElementById('table-title');
        const tableBody = document.querySelector('#species-table tbody');
        const mammalCountEl = document.getElementById('mammal-count');
        const birdCountEl = document.getElementById('bird-count');

        let biodiversityData = [];

        // --- Animate Number Function ---
        function setupNav() {
            const authContainer = document.getElementById('auth-link-container');
            const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';

            if (isLoggedIn) {
                authContainer.innerHTML = '<a href="#" id="logout-btn">LOGOUT</a>';
                const logoutBtn = document.getElementById('logout-btn');
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    sessionStorage.removeItem('isLoggedIn');
                    window.location.href = 'login.html';
                });
            } else {
                authContainer.innerHTML = '<a href="login.html">LOGIN</a>';
            }
        }


        function animateCount(element, finalCount) {
            let currentCount = 0;
            const duration = 1000; // 1 second
            const stepTime = Math.abs(Math.floor(duration / finalCount)) || 50;

            const timer = setInterval(() => {
                currentCount++;
                element.textContent = `${currentCount} SPECIES`;
                if (currentCount === finalCount) {
                    clearInterval(timer);
                }
            }, stepTime);
        }

        // --- Data Loading ---
        document.addEventListener('DOMContentLoaded', () => {
            setupNav();
            Papa.parse('assets/biodiversity.csv', {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: (results) => {
                    biodiversityData = results.data;
                    processData(biodiversityData);
                },
                error: (err) => console.error("Error parsing CSV:", err)
            });
        });

        function processData(data) {
            const getUniqueSpeciesByTaxa = (taxa) => {
                const speciesInTaxa = data.filter(item => item.Taxa === taxa);
                const unique = [...new Map(speciesInTaxa.map(item => [item['Nama Ilmiah'], item])).values()];
                return unique;
            };

            const mammals = getUniqueSpeciesByTaxa('Mamalia');
            const birds = getUniqueSpeciesByTaxa('Burung');

            animateCount(mammalCountEl, mammals.length);
            animateCount(birdCountEl, birds.length);

            document.querySelectorAll('.taxa-card').forEach(card => {
                card.addEventListener('click', () => {
                    const selectedTaxa = card.dataset.taxa;
                    const dataToShow = selectedTaxa === 'Mamalia' ? mammals : birds;
                    showTableView(selectedTaxa, dataToShow);
                });
            });
        }

        function showTableView(taxa, data) {
            tableTitle.textContent = `Species List: ${taxa === 'Mamalia' ? 'Mammals' : 'Birds'}`;
            tableBody.innerHTML = ''; // Clear previous data

            data.sort((a, b) => a.Jenis.localeCompare(b.Jenis)); // Sort alphabetically

            data.forEach(item => {
                const row = document.createElement('tr');
                row.style.cursor = 'pointer';
                row.title = `Click to see locations for ${item.Jenis}`;
                row.addEventListener('click', () => {
                    window.location.href = `explore.html?species=${encodeURIComponent(item.Jenis)}`;
                });
                row.innerHTML = `
                    <td>${item.Jenis || '-'}</td>
                    <td><em>${item['Nama Ilmiah'] || '-'}</em></td>
                    <td>${item['Status IUCN'] || '-'}</td>
                `;
                tableBody.appendChild(row);
            });

            taxaSelectionView.style.display = 'none';
            speciesTableView.style.display = 'block';
        }

        backBtn.addEventListener('click', (e) => {
            e.preventDefault();
            taxaSelectionView.style.display = 'flex';
            speciesTableView.style.display = 'none';
        });

        // Navigation handler
        document.querySelectorAll('nav a').forEach(a => a.addEventListener('click', e => {
            const href = a.getAttribute('href');
            if (href.startsWith('http') || !href.includes('#')) {
                return; // Let browser handle normal links
            }
            // For links with anchors to other pages
            e.preventDefault();
            window.location.href = href.replace('kemuning_forest_site.html', 'index.html');
        }));
    </script>

</body>
</html>
