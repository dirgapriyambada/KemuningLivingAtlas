<script>
        const { createClient } = supabase;
        const SUPABASE_URL = 'https://vkfkvwkktgezipxbwzmg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrZmt2d2trdGdlemlweGJ3em1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYyMjA5MDIsImV4cCI6MjA4MTc5NjkwMn0.H9n8_rLj5ZfxPHA1jBWdU2uuW9TpfjWzCckEU8X-zVk';
        const dbClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        let biodiversityData = [];
        let gridLayer, riverLayer, map;
        let selectedLayer = null;
        let selectedLayerType = null;
        let currentGridRawData = [];
        let sortDirection = 1;
        let trendChartInstance = null;
        let locationChartInstance = null;
        let isDataReady = false;
        
        const accentColor = '#c4ff9d';
        const iucnColors = { 'CR': '#d9534f', 'EN': '#f0ad4e', 'VU': '#f0ad4e', 'NT': '#5bc0de', 'LC': '#5cb85c', 'DD': '#777' };

        document.addEventListener('DOMContentLoaded', () => {
            initializeMap();
            loadFullData(); 
            fetchHeaderStats(); 
            fetchLastMonitoring(); 

            // REALTIME LISTENER
            dbClient.channel('public:observations').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'observations' }, 
            (payload) => {
                showRealtimeNotification("New data received! Refreshing...");
                loadFullData(); 
                fetchHeaderStats();
                fetchLastMonitoring();
            }).subscribe();
        });

        // --- FUNGSI DOWNLOAD BERTAHAP (SOLUSI MASALAHMU) ---
        async function loadFullData() {
            try {
                // Tampilkan loading
                const loadingText = document.getElementById('loading-text');
                if(loadingText) loadingText.innerText = "Downloading large dataset...";

                let allRows = [];
                let from = 0;
                let step = 1000; // Supabase limit default
                let more = true;

                // LOOPING: Ambil 1000, lalu 1000 lagi, sampai habis
                while(more) {
                    const { data, error } = await dbClient
                        .from('biodiversity_dashboard')
                        .select('*')
                        .range(from, from + step - 1);

                    if (error) throw error;

                    if (data.length > 0) {
                        allRows = allRows.concat(data);
                        from += step;
                        // Update teks loading biar user tau progresnya
                        if(loadingText) loadingText.innerText = `Fetched ${allRows.length} records...`;
                    }

                    // Jika data yang didapat kurang dari 1000, berarti sudah penghabisan
                    if (data.length < step) {
                        more = false;
                    }
                }

                biodiversityData = allRows;
                console.log(`✅ TOTAL DATA TER-DOWNLOAD: ${biodiversityData.length} baris.`); // Cek Console F12, harusnya 3500+

                populateDropdowns();
                
                // Hilangkan Loading Screen
                document.getElementById('loading-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading-overlay').style.display = 'none';
                    document.getElementById('dashboard-content').classList.add('ready');
                    isDataReady = true;
                    if(selectedLayer) { 
                        // Refresh view jika sedang buka grid
                        const id = selectedLayer.feature.properties.Name || selectedLayer.feature.properties.Sungai;
                        selectLocation(selectedLayer, id, selectedLayerType);
                    }
                }, 500);

            } catch (err) {
                console.error("LOAD ERROR:", err);
                document.getElementById('loading-text').innerText = "Error loading data. Check console.";
                document.getElementById('loading-text').style.color = "red";
            }
        }

        // --- FILTER LOKASI (YANG SUDAH DIPERBAIKI SEBELUMNYA) ---
        function selectLocation(layer, id, type) {
            if (selectedLayer && selectedLayer !== layer) resetLayerStyle(selectedLayer, selectedLayerType);
            selectedLayer = layer; selectedLayerType = type;

            if (type === 'grid') {
                layer.setStyle({ color: '#fff', weight: 4, opacity: 1, fillColor: '#fff', fillOpacity: 0.1 });
                document.getElementById('grid-title').innerText = `Grid Cell ${id}`;
            } else {
                layer.setStyle({ color: '#4aa3ff', weight: 6 });
                document.getElementById('grid-title').innerText = `River Transect ${id}`;
            }

            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('detail-content').style.display = 'flex';
            document.getElementById('detail-section').scrollIntoView({ behavior: 'smooth' });

            const targetClean = String(id).toLowerCase().replace(/[^a-z0-9]/g, ''); 
            console.log(`🔍 KLIK PETA: "${id}" (Mencari clean_plot: "${targetClean}")`);

            // Filter data yang sudah lengkap (3500+ baris)
            currentGridRawData = biodiversityData.filter(d => {
                // Prioritaskan kolom 'clean_plot' dari SQL View baru
                // Fallback ke kolom lain jika view lama
                const dbClean = getVal(d, 'clean_plot') || String(getVal(d, 'Plot')).toLowerCase().replace(/[^a-z0-9]/g, '');
                
                return dbClean.includes(targetClean) || targetClean.includes(dbClean);
            });

            console.log(`✅ HASIL FILTER: ${currentGridRawData.length} data ditemukan untuk grid ini.`);

            populateTableFilters(currentGridRawData);
            renderTable(currentGridRawData);
        }

        // --- FUNGSI HELPER LAIN (COPY-PASTE STANDAR) ---
        function showRealtimeNotification(msg) {
            const toast = document.createElement('div');
            toast.innerText = msg;
            Object.assign(toast.style, { position: 'fixed', bottom: '20px', right: '20px', background: '#184D32', color: '#fff', padding: '15px 25px', borderRadius: '50px', zIndex: '9999', opacity: '0', transition: 'opacity 0.5s' });
            document.body.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 100);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 4000);
        }

        function getVal(item, key) {
            return item[key] || item[key.toLowerCase()] || item[key.toUpperCase()] || null;
        }

        async function fetchHeaderStats() {
            try {
                const { count: cm } = await dbClient.from('view_species_mamalia').select('*', { count: 'exact', head: true });
                const { count: cb } = await dbClient.from('view_species_burung').select('*', { count: 'exact', head: true });
                const { count: ch } = await dbClient.from('view_species_herpetofauna').select('*', { count: 'exact', head: true });
                document.getElementById('stat-mammal').innerText = cm || 0;
                document.getElementById('stat-bird').innerText = cb || 0;
                document.getElementById('stat-herp').innerText = ch || 0;
            } catch(e){}
        }

        async function fetchLastMonitoring() {
            try {
                const { data } = await dbClient.from('surveys').select('created_at').order('created_at', { ascending: false }).limit(1);
                if (data?.[0]) {
                    const d = new Date(data[0].created_at);
                    document.getElementById('last-monitoring-date').innerText = `${d.toLocaleString('default', { month: 'long' })}, ${d.getFullYear()}`;
                }
            } catch(e){}
        }

        function initializeMap() {
            const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri' });
            map = L.map('map', { center: [-7.135, 110.105], zoom: 15, layers: [esriSat], zoomControl: false });
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            fetch('assets/rivers.geojson').then(r => r.json()).then(data => {
                riverLayer = L.geoJSON(data, { style: { color: '#3498db', weight: 3 }, onEachFeature: (f, l) => setupFeature(f, l, 'river') }).addTo(map);
            });
            fetch('assets/grids.geojson').then(r => r.json()).then(data => {
                gridLayer = L.geoJSON(data, { style: { color: accentColor, weight: 1, fillOpacity: 0.15 }, onEachFeature: (f, l) => setupFeature(f, l, 'grid') }).addTo(map);
                map.fitBounds(gridLayer.getBounds());
            });
            map.on('click', () => { if(isDataReady) resetSelection(); });
        }

        function setupFeature(feature, layer, type) {
            const id = feature.properties.Name || feature.properties.Sungai;
            layer.bindTooltip(id, { permanent: type==='grid', direction: 'center', className: 'grid-label' });
            layer.on({
                mouseover: (e) => { if(layer !== selectedLayer) e.target.setStyle({ weight: 3, color: '#fff', fillOpacity: 0.4 }); },
                mouseout: (e) => { if(layer !== selectedLayer) resetLayerStyle(layer, type); },
                click: (e) => { L.DomEvent.stopPropagation(e); selectLocation(layer, id, type); }
            });
        }

        function resetLayerStyle(layer, type) {
            if(type === 'grid') gridLayer.resetStyle(layer);
            else riverLayer.resetStyle(layer);
        }

        function resetSelection() {
            if (selectedLayer) resetLayerStyle(selectedLayer, selectedLayerType);
            selectedLayer = null; selectedLayerType = null;
            document.getElementById('empty-state').style.display = 'flex';
            document.getElementById('detail-content').style.display = 'none';
        }

        function populateDropdowns() {
            const mSelect = document.getElementById('filterMonth');
            const ySelect = document.getElementById('filterYear');
            
            const months = [...new Set(biodiversityData.map(d => getVal(d, 'Bulan')))].filter(x=>x).sort();
            const years = [...new Set(biodiversityData.map(d => getVal(d, 'Tahun')))].filter(x=>x).sort();

            mSelect.innerHTML = '<option value="All">Survey Month</option>';
            ySelect.innerHTML = '<option value="All">Survey Year</option>';
            
            months.forEach(m => mSelect.innerHTML += `<option value="${m}">${m}</option>`);
            years.forEach(y => ySelect.innerHTML += `<option value="${y}">${y}</option>`);
            
            mSelect.addEventListener('change', applyFilters);
            ySelect.addEventListener('change', applyFilters);
            document.getElementById('searchSpecies').addEventListener('input', applyFilters);
        }
        
        const searchInput = document.getElementById('searchSpecies');
        const clearBtn = document.getElementById('clearSearch');
        const dropdownList = document.getElementById('custom-dropdown');

        searchInput.addEventListener('input', function() {
            const val = this.value;
            clearBtn.style.display = val.length > 0 ? 'block' : 'none';
            dropdownList.innerHTML = '';
            if (!val) { dropdownList.style.display = 'none'; applyFilters(); return; }
            const uniqueSpecies = [...new Set(biodiversityData.map(d => getVal(d, 'Jenis')))];
            const matches = uniqueSpecies.filter(s => s && s.toLowerCase().includes(val.toLowerCase()));
            if (matches.length > 0) {
                dropdownList.style.display = 'block';
                matches.forEach(species => {
                    const item = document.createElement('div');
                    item.className = 'autocomplete-item';
                    item.innerText = species;
                    item.addEventListener('click', function() {
                        searchInput.value = species;
                        dropdownList.style.display = 'none';
                        applyFilters();
                    });
                    dropdownList.appendChild(item);
                });
            } else { dropdownList.style.display = 'none'; }
            applyFilters();
        });

        document.addEventListener('click', function(e) { if (!searchInput.contains(e.target) && !dropdownList.contains(e.target)) dropdownList.style.display = 'none'; });
        clearBtn.addEventListener('click', function() { searchInput.value = ''; this.style.display = 'none'; dropdownList.style.display = 'none'; applyFilters(); });

        function applyFilters() {
            const search = searchInput.value.toLowerCase();
            const month = document.getElementById('filterMonth').value;
            const year = document.getElementById('filterYear').value;
            if(gridLayer) gridLayer.eachLayer(layer => { if(layer !== selectedLayer) gridLayer.resetStyle(layer); });
            
            const filtered = biodiversityData.filter(d => {
                const jenis = getVal(d, 'Jenis') || '';
                const namaIlmiah = getVal(d, 'Nama Ilmiah') || '';
                const matchSearch = (jenis + ' ' + namaIlmiah).toLowerCase().includes(search);
                const matchMonth = month === 'All' || getVal(d, 'Bulan') === month;
                const matchYear = year === 'All' || getVal(d, 'Tahun') == year;
                return matchSearch && matchMonth && matchYear;
            });

            if(search.length > 0 || month !== 'All' || year !== 'All') {
                const activePlots = new Set(filtered.map(d => getVal(d, 'Plot')));
                if(gridLayer) {
                    gridLayer.eachLayer(layer => {
                        if (activePlots.has(layer.feature.properties.Name)) layer.setStyle({ fillColor: '#c4ff9d', fillOpacity: 0.5, color: '#fff', weight: 2 });
                    });
                }
            }
        }

        function populateTableFilters(data) {
             const taxaSel = document.getElementById('tableFilterTaxa');
             const monthSel = document.getElementById('tableFilterMonth');
             const yearSel = document.getElementById('tableFilterYear');
             taxaSel.innerHTML = '<option value="All">All</option>'; monthSel.innerHTML = '<option value="All">All</option>'; yearSel.innerHTML = '<option value="All">All</option>';
             
             const taxaList = [...new Set(data.map(d => getVal(d, 'Taxa')))].sort();
             const monthList = [...new Set(data.map(d => getVal(d, 'Bulan')))].sort();
             const yearList = [...new Set(data.map(d => getVal(d, 'Tahun')))].sort();
             
             taxaList.forEach(t => taxaSel.innerHTML += `<option value="${t}">${t}</option>`);
             monthList.forEach(m => monthSel.innerHTML += `<option value="${m}">${m}</option>`);
             yearList.forEach(y => yearSel.innerHTML += `<option value="${y}">${y}</option>`);
        }

        function applyTableFilters() {
            const fTaxa = document.getElementById('tableFilterTaxa').value;
            const fMonth = document.getElementById('tableFilterMonth').value;
            const fYear = document.getElementById('tableFilterYear').value;
            const filtered = currentGridRawData.filter(d => {
                return (fTaxa === 'All' || getVal(d, 'Taxa') === fTaxa) && 
                       (fMonth === 'All' || getVal(d, 'Bulan') === fMonth) && 
                       (fYear === 'All' || getVal(d, 'Tahun') == fYear);
            });
            renderTable(filtered);
        }

        function sortGridData(key) {
            sortDirection *= -1;
            currentGridRawData.sort((a, b) => {
                let valA = String(getVal(a, key)).toLowerCase();
                let valB = String(getVal(b, key)).toLowerCase();
                if(valA < valB) return -1 * sortDirection;
                if(valA > valB) return 1 * sortDirection;
                return 0;
            });
            applyTableFilters();
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 20px;">No matching records.</td></tr>';
                return;
            }
            data.forEach(r => {
                const iucn = getVal(r, 'Status IUCN') || 'NE';
                let badgeColor = '#777';
                Object.keys(iucnColors).forEach(k => { if(iucn.includes(k)) badgeColor = iucnColors[k]; });

                const behavior = getVal(r, 'behavior') || getVal(r, 'Perilaku') || '-';
                const encounter = getVal(r, 'encounter_type') || getVal(r, 'Tipe Jumpa') || '-';
                const otherEnc = getVal(r, 'other_encounter_type'); 
                const displayEnc = (encounter === 'Lainnya' && otherEnc) ? `${encounter} (${otherEnc})` : encounter;

                const row = `<tr>
                    <td><strong class="clickable-species" onclick="showAnalytics('${getVal(r, 'Jenis')}')">${getVal(r, 'Jenis') || '-'}</strong><em>${getVal(r, 'Nama Ilmiah') || '-'}</em></td>
                    <td>${getVal(r, 'Taxa') || '-'}</td>
                    <td>${getVal(r, 'Jumlah') || 1}</td>
                    <td>${behavior}</td>
                    <td>${displayEnc}</td>
                    <td>${getVal(r, 'Bulan') || '-'}</td>
                    <td><span class="status-badge" style="background:${badgeColor}">${iucn}</span></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }
        
        function showAnalytics(name) { 
            const modal = document.getElementById('analyticsModal');
            const title = document.getElementById('analytics-title');
            const speciesData = biodiversityData.filter(d => getVal(d, 'Jenis') === name);
            if(speciesData.length === 0) return;
            title.innerText = `Analysis: ${name}`;
            
            const timeMap = {};
            speciesData.forEach(d => {
                const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                const bulan = getVal(d, 'Bulan');
                const tahun = getVal(d, 'Tahun');
                const jumlah = getVal(d, 'Jumlah');
                const monthIndex = monthNames.indexOf(bulan);
                const sortKey = `${tahun}-${String(monthIndex + 1).padStart(2, '0')}`;
                const displayLabel = `${bulan} ${tahun}`;
                if(!timeMap[sortKey]) timeMap[sortKey] = { label: displayLabel, count: 0 };
                timeMap[sortKey].count += (jumlah || 1);
            });
            const sortedTimeKeys = Object.keys(timeMap).sort();
            const timeLabels = sortedTimeKeys.map(k => timeMap[k].label);
            const timeCounts = sortedTimeKeys.map(k => timeMap[k].count);

            const locMap = {};
            speciesData.forEach(d => {
                const plot = getVal(d, 'Plot') || "Unknown";
                const jumlah = getVal(d, 'Jumlah');
                if(!locMap[plot]) locMap[plot] = 0;
                locMap[plot] += (jumlah || 1);
            });
            const sortedLocs = Object.entries(locMap).sort((a,b) => b[1] - a[1]).slice(0, 5);
            const locLabels = sortedLocs.map(i => i[0]);
            const locCounts = sortedLocs.map(i => i[1]);

            const ctxTrend = document.getElementById('trendChart').getContext('2d');
            if(trendChartInstance) trendChartInstance.destroy();
            trendChartInstance = new Chart(ctxTrend, {
                type: 'line',
                data: {
                    labels: timeLabels,
                    datasets: [{ label: 'Individuals Observed', data: timeCounts, borderColor: '#184D32', backgroundColor: 'rgba(24, 77, 50, 0.1)', borderWidth: 2, tension: 0.3, fill: true }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctxLoc = document.getElementById('locationChart').getContext('2d');
            if(locationChartInstance) locationChartInstance.destroy();
            locationChartInstance = new Chart(ctxLoc, {
                type: 'bar',
                data: {
                    labels: locLabels,
                    datasets: [{ label: 'Total Count', data: locCounts, backgroundColor: '#87CEA2', borderRadius: 5 }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            modal.classList.add('active');
        }

        function closeAnalytics() { document.getElementById('analyticsModal').classList.remove('active'); }
        document.getElementById('analyticsModal').addEventListener('click', (e) => {
            if(e.target === document.getElementById('analyticsModal')) closeAnalytics();
        });
    </script>
