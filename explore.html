<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - Kemuning Forest Living Atlas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        :root {
            --bg: #1c2d15;
            --accent: #c4ff9d;
            --muted: #6b7a63;
            --panel: #23321f;
            --highlight: #4aa3ff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Raleway', system-ui, Arial, sans-serif;
            background: var(--bg);
        }

        @font-face {
            font-family: 'WWF';
            src: url('assets/wwf.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Raleway';
            src: url('assets/Raleway-Medium.ttf') format('truetype');
        }

        #map { width: 100%; height: 100%; z-index: 1; }
        .leaflet-tooltip.grid-label {
            background-color: transparent; border: none; box-shadow: none; color: #fff;
            font-size: 14px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 4px #000;
            transition: opacity 0.3s ease;
        }
        .leaflet-tooltip.label-hidden { opacity: 0 !important; }

        /* Header Nav */
        nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 40px;background:rgba(12,18,10,0.98);z-index:1200}
        .nav-logo img { height: 40px; transition: transform 0.2s; }
        .nav-logo:hover img { transform: scale(1.1); }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a{color:var(--accent);text-decoration:none;font-family:'WWF', sans-serif; font-size: 20px; letter-spacing: 1px; padding:6px 14px;border-radius:20px;transition:all .22s}
        .nav-links a.active, .nav-links a:hover{background:#314d25;color:#fff}

        .ui-container {
            position: absolute; top: 80px; left: 20px; z-index: 1000;
            display: flex;
            align-items: center;
            gap: 20px;
        }


        /* Search Panel (Overlay) */
        .search-panel {
            position: relative;
            background: var(--panel); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
            color: #dfeee0; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
        }
        .search-panel.minimized {
            width: 50px; height: 50px; padding: 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .search-panel:not(.minimized) { width: 340px; padding: 18px; }
        .search-panel-content { display: none; }
        .search-panel:not(.minimized) .search-panel-content { display: block; }

        #explore-title {
            font-family: 'WWF', sans-serif;
            font-size: 28px;
            color: var(--accent);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: opacity 0.4s ease, transform 0.4s ease;
            white-space: nowrap; /* Prevent text from wrapping */
        }
        .search-panel:not(.minimized) ~ #explore-title { opacity: 0; transform: translateX(-20px); pointer-events: none; }

        /* Search Input & Autocomplete */
        .search-container { position: relative; }
        .search { display: flex; gap: 8px; margin-bottom: 12px; }
        .search input { flex: 1; padding: 10px; border-radius: 8px; border: 0; background: #2b3b2a; color: var(--accent); font-family: 'Raleway', sans-serif; }
        .search button { border-radius: 8px; border: 0; cursor: pointer; background-color: transparent; background-repeat: no-repeat; background-position: center; text-indent: -9999px; overflow: hidden; }
        .search button.icon-btn { background-color: #4a5a47; width: 38px; flex-shrink: 0; background-size: 20px; }
        #searchBtn { background-color: var(--highlight); background-image: url('assets/search.png'); background-size: 20px; width: 60px; }
        .search button.toggle-btn { transition: transform 0.3s; }
        .search-panel.minimized .search button.toggle-btn { transform: rotate(180deg); }


        #autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0; background: #2b3b2a;
            border-radius: 0 0 8px 8px; max-height: 200px; overflow-y: auto; z-index: 1001;
        }
        #autocomplete-list div { padding: 10px; color: var(--accent); cursor: pointer; }
        #autocomplete-list div:hover { background: #3a4c38; }

        /* Button Group Filters */
        .filter-group { margin-bottom: 12px; }
        .filter-group label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
        .button-group { display: flex; flex-wrap: wrap; gap: 6px; }
        .button-group button {
            padding: 5px 10px; border: 1px solid #4a5a47; background: transparent;
            color: var(--muted); border-radius: 16px; cursor: pointer; transition: all 0.2s;
        }
        .button-group button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: bold; }

        /* Right Detail Panel */
        .detail-panel {
            position: absolute; top: 0; right: 0; bottom: 0; width: 380px;
            background: rgba(22, 33, 19, 0.95); backdrop-filter: blur(10px);
            z-index: 1001; padding: 80px 25px 25px 25px;
            transform: translateX(100%); transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.4);
        }
        .detail-panel.visible { transform: translateX(0); }
        .detail-panel .close-btn {
            position: absolute; top: 20px; right: 20px; background: none; border: none;
            cursor: pointer; line-height: 1; top: 15px;
            width: 32px; height: 32px; background-image: url('assets/back.png'); background-size: contain; background-repeat: no-repeat;
            font-size: 0; /* Hide text */
        }
        .detail-panel h3 { color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 8px; margin-bottom: 15px; }
        .detail-panel #detail-info { color: var(--accent); font-weight: bold; }
        .detail-panel h4 { color: var(--muted); margin-top: 15px; margin-bottom: 10px; }
        .species-list { max-height: calc(100vh - 200px); overflow-y: auto; }
        .species-item { padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.2); margin-bottom: 8px; color: #e9f7e6; }
        .species-item strong { color: var(--accent); }
        .detail-panel .taxa-filter-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .detail-panel .taxa-filter-buttons button {
            flex: 1; padding: 8px; border: 1px solid #4a5a47; background: transparent;
            color: var(--muted); border-radius: 8px; cursor: pointer; transition: all 0.2s;
        }
        .detail-panel .taxa-filter-buttons button.active {
            background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: bold;
        }

        /* Map Controls */
        .leaflet-control-container .leaflet-top.leaflet-right { margin-top: 80px; }
        .leaflet-bar a, .leaflet-bar a:hover {
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
        .leaflet-control-zoom-in, .leaflet-control-zoom-out {
            font-size: 0 !important; /* Hide default '+' and '-' */
            background-repeat: no-repeat;
            background-position: center;
            background-size: 22px;
            filter: brightness(0); /* Change icon color to black */
        }
        .leaflet-control-zoom-in { background-image: url('assets/zoomin.png') !important; }
        .leaflet-control-zoom-out { background-image: url('assets/zoomout.png') !important; }
        .reset-map-btn { background-image: url('assets/refresh.png'); background-size: 22px; background-repeat: no-repeat; background-position: center; font-size: 0 !important; filter: brightness(0); }


        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            nav {
                gap: 8px;
                justify-content: space-around;
            }
            nav a {
                padding: 6px 8px;
                font-size: 12px;
            }
            .search-panel {
                top: 65px; /* Adjust for smaller nav */
                left: 10px;
            }
            .search-panel:not(.minimized) {
                width: calc(100% - 20px); /* Full width with some margin */
            }
            .detail-panel {
                width: 100%;
                padding-top: 65px;
            }
            .detail-panel .close-btn {
                top: 10px;
            }
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div class="ui-container">
        <div class="search-panel minimized" id="search-panel">
            <button class="toggle-btn" id="toggle-search-panel" title="Open Panel" style="width: 50px; height: 50px; background-image: url('assets/search.png'); background-size: 24px; background-color: transparent; border: none; cursor: pointer; text-indent: -9999px; background-repeat: no-repeat; background-position: center;"></button>
            <div class="search-panel-content">
            <div class="search-container">
                <div class="search">
                    <input id="searchSpecies" placeholder="Search species..." autocomplete="off" lang="id" />
                    <button id="searchBtn" title="Search">Search</button>
                    <button id="resetBtn" class="icon-btn" title="Reset Filter">&#8634;</button>
                    <button id="toggle-search-btn-inner" class="icon-btn toggle-btn" title="Close Panel">&#x2190;</button>
                </div>
                <div id="autocomplete-list"></div>
            </div>
            <div class="filter-group">
                <label>Taxa</label>
                <div class="button-group" id="filterTaxa"></div>
            </div>
            <div class="filter-group">
                <label>Year</label>
                <div class="button-group" id="filterYear"></div>
            </div>
            <div class="filter-group">
                <label>Month</label>
                <div class="button-group" id="filterMonth"></div>
            </div>
        </div>
    </div>
        <h2 id="explore-title">Explore Our Biodiversity!</h2>
    </div>

    <div class="detail-panel" id="detail-panel">
        <button class="close-btn" id="close-detail-panel">&times;</button>
        <h3 id="detail-plot-name">Plot Details</h3>
        <div id="detail-info"></div>
        <div class="taxa-filter-buttons" id="detail-taxa-filter">
            <button data-taxa="All" class="active">All</button>
            <button data-taxa="Mamalia">Mammals</button>
            <button data-taxa="Burung">Birds</button>
        </div>
        <div class="species-list" id="species-list" lang="id"></div>
    </div>

    <nav>
        <a href="about.html" class="nav-logo">
            <img src="assets/jawi.png" alt="Javan Wildlife Institute Logo">
        </a>
        <div class="nav-links">
            <a href="index.html#home">HOME</a>
            <a href="index.html#location">LOCATION</a>
            <a href="explore.html" class="active">EXPLORE</a>
            <a href="species.html">SPECIES</a>
            <a href="about.html">ABOUT</a>
        </div>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // --- DOM ELEMENTS ---
        const searchPanel = document.getElementById('search-panel');
        const toggleSearchBtn = document.getElementById('toggle-search-panel');
        const detailPanel = document.getElementById('detail-panel');
        const closeDetailBtn = document.getElementById('close-detail-panel');
        const detailPlotName = document.getElementById('detail-plot-name');
        const detailInfo = document.getElementById('detail-info');
        const speciesListEl = document.getElementById('species-list');
        const searchInput = document.getElementById('searchSpecies');
        const autocompleteList = document.getElementById('autocomplete-list');
        const searchBtn = document.getElementById('searchBtn');
        const resetBtn = document.getElementById('resetBtn');
        const toggleSearchBtnInner = document.getElementById('toggle-search-btn-inner');

        // --- GLOBAL STATE ---
        let biodiversityData = [];
        let gridLayers = {};
        let map;
        let initialBounds;
        let uniqueSpecies = [];
        let currentSelectedPlot = null;

        // --- LEAFLET MAP SETUP ---
        function initializeMap() {
            map = L.map('map', { attributionControl: false, zoomControl: false }).setView([-7.135, 110.105], 15);
            L.control.zoom({ position: 'topright' }).addTo(map); // Moved to top-right
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri'
            }).addTo(map);
            L.control.attribution({ prefix: false }).addTo(map);

            // Custom Reset View Control
            L.Control.ResetView = L.Control.extend({
                onAdd: function(map) {
                    const btn = L.DomUtil.create('a', 'leaflet-bar-part leaflet-bar-part-single reset-map-btn');
                    btn.innerHTML = 'Reset'; // Fallback text, will be hidden by CSS
                    btn.href = '#';
                    btn.title = 'Reset View';
                    btn.role = 'button';
                    L.DomEvent.on(btn, 'click', L.DomEvent.stop).on(btn, 'click', resetMapState);
                    const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                    container.appendChild(btn);
                    return container;
                }
            });
            L.control.resetView = (opts) => new L.Control.ResetView(opts);
            L.control.resetView({ position: 'topright' }).addTo(map);

            loadGeoJSON();

            map.on('zoomend', toggleGridLabels);
            map.on('click', () => {
                hideDetailPanel();
            });
        }

        const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#c4ff9d';
        const highlightColor = getComputedStyle(document.documentElement).getPropertyValue('--highlight').trim();

        function loadGeoJSON() {
            fetch('assets/grids.geojson')
                .then(res => res.json())
                .then(data => {
                    const gridLayer = L.geoJSON(data, {
                        style: getBaseStyle,
                        onEachFeature: (feature, layer) => {
                            const plotName = feature.properties.Name;
                            gridLayers[plotName] = layer;
                            layer.bindTooltip(plotName, { permanent: true, direction: 'center', className: 'grid-label' });
                            layer.on({
                                click: (e) => {
                                    L.DomEvent.stopPropagation(e); // Prevent click from reaching the map
                                    selectPlot(plotName);
                                },
                                mouseover: (e) => {
                                    // Don't apply hover effect if the plot is already selected
                                    if (plotName !== currentSelectedPlot) {
                                        e.target.setStyle({ weight: 2.5, fillOpacity: 0.3 });
                                    }
                                },
                                mouseout: (e) => {
                                    // Revert to the base or highlighted style, but not the selected style
                                    gridLayer.resetStyle(e.target);
                                }
                            });
                        }
                    }).addTo(map);
                    initialBounds = gridLayer.getBounds();
                    map.fitBounds(initialBounds);
                    // toggleGridLabels is called by 'zoomend' after fitBounds
                })
                .catch(error => console.error('Error loading GeoJSON:', error));
        }

        function getBaseStyle() {
            return { color: accentColor, weight: 1, opacity: 0.6, fillColor: accentColor, fillOpacity: 0.1 };
        }

        function getHighlightStyle() {
            return { fillOpacity: 0.5, weight: 3, color: accentColor };
        }

        function getSelectedStyle() {
            return { weight: 3, color: highlightColor, fillOpacity: 0.3 };
        }

        function toggleGridLabels() {
            const zoomLevel = map.getZoom();
            const showLabels = zoomLevel >= (map.getBoundsZoom(initialBounds) - 1); // Show labels at default zoom or closer
            Object.values(gridLayers).forEach(layer => {
                const tooltip = layer.getTooltip();
                if (tooltip) {
                    tooltip.getElement().classList.toggle('label-hidden', !showLabels);
                }
            });
        }

        // --- DATA LOADING & PROCESSING ---
        document.addEventListener('DOMContentLoaded', () => {
            initializeMap();
            Papa.parse('assets/biodiversity.csv', {
                download: true, header: true, skipEmptyLines: true,
                complete: (results) => {
                    biodiversityData = results.data;
                    uniqueSpecies = [...new Set(biodiversityData.map(item => item.Jenis).concat(biodiversityData.map(item => item["Nama Ilmiah"])))].filter(Boolean).sort();
                    populateFilters(biodiversityData);
                },
                error: (err) => console.error("Error parsing CSV:", err)
            });
        });

        // Prevent map click when interacting with panels
        document.addEventListener('DOMContentLoaded', () => {
            L.DomEvent.disableClickPropagation(searchPanel);
            L.DomEvent.disableClickPropagation(detailPanel);
        });

        // --- UI INTERACTIONS ---

        // Search Panel Toggle
        const togglePanel = () => {
            searchPanel.classList.toggle('minimized');
            const isMinimized = searchPanel.classList.contains('minimized');
            toggleSearchBtn.style.backgroundImage = isMinimized ? `url('assets/search.png')` : `url('assets/back.png')`;
            toggleSearchBtn.title = isMinimized ? 'Open Panel' : 'Close Panel';
            // The inner button always shows the back icon
        };

        // Initial setup for icons
        document.getElementById('resetBtn').style.backgroundImage = `url('assets/refresh.png')`;
        document.getElementById('toggle-search-btn-inner').style.backgroundImage = `url('assets/back.png')`;

        toggleSearchBtn.addEventListener('click', togglePanel);
        toggleSearchBtnInner.addEventListener('click', togglePanel);

        if (searchPanel.classList.contains('minimized')) {
             searchPanel.addEventListener('click', (e) => {
                // Allow clicking the minimized panel itself to expand it
                if(e.target === searchPanel) {
                    togglePanel();
                }
             });
        }

        // Detail Panel
        function selectPlot(plotName) {
            currentSelectedPlot = plotName;
            resetGridStyles();
            const targetLayer = gridLayers[plotName];
            if (targetLayer) {
                targetLayer.setStyle(getSelectedStyle());
                targetLayer.bringToFront();
            }
            
            // Reset detail taxa filter to 'All'
            document.querySelectorAll('#detail-taxa-filter button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.taxa === 'All');
            });

            renderDetailPanel(plotName);
            detailPanel.classList.add('visible');
        }

        function renderDetailPanel(plotName, taxaFilter = 'All') {
            const records = biodiversityData.filter(d => d.Plot === plotName);
            detailPlotName.textContent = `Plot Details: ${plotName}`;

            if (records.length === 0) {
                detailInfo.innerHTML = `<em>No data found.</em>`;
                speciesListEl.innerHTML = '-';
            } else {
                const mammalCount = records.filter(r => r.Taxa === 'Mamalia').length;
                const birdCount = records.filter(r => r.Taxa === 'Burung').length;
                detailInfo.innerHTML = `Observations: ${records.length}<br><small style="font-weight:normal; color: #dfeee0;">(Mammals: ${mammalCount}, Birds: ${birdCount})</small>`;

                // 1. Filter records by the selected taxa in the detail panel ('All', 'Mamalia', 'Burung')
                const filteredByTaxa = taxaFilter === 'All' ? records : records.filter(r => r.Taxa === taxaFilter);

                // 2. Deduplicate the filtered records
                // We create a unique key for each observation based on its scientific name, month, and year.
                // The Map object ensures that only the first entry for each unique key is kept.
                const uniqueRecords = [...new Map(filteredByTaxa.map(item =>
                    [`${item["Nama Ilmiah"]}-${item.Bulan}-${item.Tahun}`, item]
                )).values()];
                
                // 3. Render the deduplicated list
                speciesListEl.innerHTML = uniqueRecords.map(r =>
                    `<div class="species-item"><strong>${r.Jenis}</strong><div style="font-size:12px;color:#bce7b7">${r["Nama Ilmiah"]} • ${r.Bulan}/${r.Tahun}</div></div>`
                ).join('');
            }
        }

        function hideDetailPanel() {
            detailPanel.classList.remove('visible');
            resetGridStyles();
            currentSelectedPlot = null;
        }

        closeDetailBtn.addEventListener('click', hideDetailPanel);
        
        // --- FILTER & SEARCH LOGIC ---

        // Autocomplete
        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase();
            autocompleteList.innerHTML = '';
            if (query.length < 2) return;

            const suggestions = uniqueSpecies.filter(s => s.toLowerCase().includes(query)).slice(0, 5);
            suggestions.forEach(s => {
                const div = document.createElement('div');
                div.textContent = s;
                div.addEventListener('click', () => {
                    searchInput.value = s;
                    autocompleteList.innerHTML = '';
                    applyFilters();
                });
                autocompleteList.appendChild(div);
            });
        });
        document.addEventListener('click', (e) => {
            if (e.target !== searchInput) autocompleteList.innerHTML = '';
        });

        // Populate Button-based Filters
        function populateFilters(data) {
            const taxaGroup = document.getElementById('filterTaxa');
            const monthGroup = document.getElementById('filterMonth');
            const yearGroup = document.getElementById('filterYear');

            const uniqueTaxa = [...new Set(data.map(item => item.Taxa))].filter(Boolean).sort();
            const uniqueYears = [...new Set(data.map(item => item.Tahun))].filter(Boolean).sort((a, b) => b - a);
            const monthOrder = { "Januari": 1, "Februari": 2, "Maret": 3, "April": 4, "Mei": 5, "Juni": 6, "Juli": 7, "Agustus": 8, "September": 9, "Oktober": 10, "November": 11, "Desember": 12 };
            const uniqueMonths = [...new Set(data.map(item => item.Bulan))].filter(Boolean).sort((a, b) => (monthOrder[a] || 99) - (monthOrder[b] || 99));

            const createButtons = (items, container) => {
                container.innerHTML = items.map(item => `<button data-value="${item}">${item}</button>`).join('');
            };

            createButtons(uniqueTaxa, taxaGroup);
            createButtons(uniqueYears, yearGroup);
            createButtons(uniqueMonths, monthGroup);

            document.querySelectorAll('.button-group').forEach(group => {
                group.addEventListener('click', e => {
                    if (e.target.tagName === 'BUTTON') {
                        const currentActive = group.querySelector('.active');
                        if (currentActive) currentActive.classList.remove('active');
                        if (currentActive !== e.target) {
                            e.target.classList.add('active');
                        }
                        applyFilters();
                    }
                });
            });
        }

        function getActiveButtonValue(groupId) {
            const activeButton = document.querySelector(`#${groupId} button.active`);
            return activeButton ? activeButton.dataset.value : '';
        }

        function applyFilters() {
            const query = searchInput.value.toLowerCase();
            const taxa = getActiveButtonValue('filterTaxa');
            const month = getActiveButtonValue('filterMonth');
            const year = getActiveButtonValue('filterYear');

            if (biodiversityData.length === 0) return;

            const filteredData = biodiversityData.filter(d => {
                const searchField = `${d.Jenis} ${d["Nama Ilmiah"]}`.toLowerCase();
                const matchesQuery = query ? searchField.includes(query) : true;
                const matchesTaxa = taxa ? d.Taxa === taxa : true;
                const matchesMonth = month ? d.Bulan === month : true;
                const matchesYear = year ? String(d.Tahun) === year : true;
                return matchesQuery && matchesTaxa && matchesMonth && matchesYear;
            });

            const plotsToHighlight = [...new Set(filteredData.map(d => d.Plot))];
            resetGridStyles();
            plotsToHighlight.forEach(plotName => {
                if (gridLayers[plotName]) {
                    gridLayers[plotName].setStyle(getHighlightStyle());
                    gridLayers[plotName].bringToFront();
                }
            });
        }

        // Reset Functions
        function resetAllFilters() {
            searchInput.value = '';
            document.querySelectorAll('.button-group button.active').forEach(btn => btn.classList.remove('active'));
            applyFilters();
        }

        function resetGridStyles() {
            Object.values(gridLayers).forEach(layer => layer.setStyle(getBaseStyle()));
        }

        function resetMapState() {
            resetAllFilters();
            hideDetailPanel();
            if (initialBounds) {
                map.fitBounds(initialBounds);
            }
            // Also minimize search panel if it's open
            if (!searchPanel.classList.contains('minimized')) {
                togglePanel();
            }
        }

        // Event Listeners
        searchBtn.addEventListener('click', applyFilters);
        searchInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') applyFilters(); });
        resetBtn.addEventListener('click', resetAllFilters);

        document.getElementById('detail-taxa-filter').addEventListener('click', e => {
            if (e.target.tagName === 'BUTTON') {
                document.querySelectorAll('#detail-taxa-filter button').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                if (currentSelectedPlot) {
                    renderDetailPanel(currentSelectedPlot, e.target.dataset.taxa);
                }
            }
        });

        // Navigation handler
        document.querySelectorAll('nav a').forEach(a => a.addEventListener('click', e => {
            const href = a.getAttribute('href');
            if (href.startsWith('http') || !href.includes('#')) {
                return; // Let browser handle normal links
            }
            // For links with anchors to other pages
            e.preventDefault();
            window.location.href = href.replace('kemuning_forest_site.html', 'index.html');
        }));

    </script>
</body>
</html>
